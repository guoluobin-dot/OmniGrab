name: Release portable builds

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: OmniGrab-windows-x64.zip
          - os: macos-latest
            artifact: OmniGrab-macos-arm64.zip
          - os: ubuntu-latest
            artifact: OmniGrab-linux-x64.tar.gz
    runs-on: ${{ matrix.os }}
    env:
      ARTIFACT: ${{ matrix.artifact }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt pyinstaller

      - name: Run tests
        run: python -m pytest -q

      - name: Build with PyInstaller
        run: pyinstaller --noconfirm --clean OmniGrab.spec

      - name: Package archive (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path dist/OmniGrab -DestinationPath "$env:ARTIFACT"

      - name: Package archive (macOS)
        if: runner.os == 'macOS'
        run: cd dist && zip -qry "../$ARTIFACT" OmniGrab

      - name: Package archive (Linux)
        if: runner.os == 'Linux'
        run: cd dist && tar -czf "../$ARTIFACT" OmniGrab

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ARTIFACT }}